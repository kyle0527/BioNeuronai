[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioneuronai"
version = "2.1"
description = "AI-driven cryptocurrency futures trading system with genetic algorithm strategy evolution"
readme = "README.md"
authors = [
    {name = "BioNeuronAI Team", email = "team@bioneuronai.example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic==2.13.4",
    "numpy==2.4.4",
    "pandas==3.0.3",
    "TA-Lib==0.6.8",
    "torch==2.8.0+cpu",
    "torchvision==0.23.0+cpu",
    "torchaudio==2.8.0+cpu",
    "sentence-transformers==5.5.0",
    "websocket-client==1.9.0",
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "aiohttp==3.13.5",
    "regex==2026.5.9",
    "faiss-cpu==1.13.2",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "schedule==1.2.2",
    "scikit-learn==1.8.0",
    "google-cloud-storage==3.10.1",
    "google-cloud-secret-manager==2.28.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
    "ruff",
]
visualization = [
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]
notifications = [
    "python-telegram-bot>=20.0",
]

[project.urls]
"Homepage" = "https://github.com/kyle0527/BioNeuronai"
"Repository" = "https://github.com/kyle0527/BioNeuronai"
"Documentation" = "https://github.com/kyle0527/BioNeuronai/tree/main/docs"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
# Note: disallow_untyped_defs disabled due to large codebase
# disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "archived",
    "tools",
    "frontend",
    "scratch",
    "evolution_data",
    "rl_models",
    "output",
    "logs",
    "data_downloads",
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    "node_modules",
    "dist",
    "build",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long, handled by formatter
    "E402",  # module level import not at top of file
    "F401",  # imported but unused (too noisy during dev)
]
