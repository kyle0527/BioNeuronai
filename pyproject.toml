[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioneuronai"
version = "2.1"
description = "AI-driven cryptocurrency futures trading system with genetic algorithm strategy evolution"
readme = "README.md"
authors = [
    {name = "BioNeuronAI Team", email = "team@bioneuronai.example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic==2.9.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "TA-Lib==0.6.8",
    "torch==2.4.1",
    "sentence-transformers==3.0.1",
    "websocket-client==1.8.0",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "aiohttp==3.10.11",
    "regex==2024.11.6",
    "faiss-cpu==1.8.0.post1",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "schedule==1.2.2",
    "scikit-learn==1.5.2",
    "google-cloud-storage==2.18.2",
    "google-cloud-secret-manager==2.20.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "black",
    "isort",
    "mypy",
    "ruff",
]
visualization = [
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]
notifications = [
    "python-telegram-bot>=20.0",
]

[project.urls]
"Homepage" = "https://github.com/kyle0527/BioNeuronai"
"Repository" = "https://github.com/kyle0527/BioNeuronai"
"Documentation" = "https://github.com/kyle0527/BioNeuronai/tree/main/docs"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
# Note: disallow_untyped_defs disabled due to large codebase
# disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    "archived",
    "tools",
    "frontend",
    "scratch",
    "evolution_data",
    "rl_models",
    "output",
    "logs",
    "data_downloads",
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    "node_modules",
    "dist",
    "build",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long, handled by formatter
    "E402",  # module level import not at top of file
    "F401",  # imported but unused (too noisy during dev)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
norecursedirs = ["archived", "tools", "node_modules", ".git", "dist", "build", "frontend"]
