# ============================================================
# BioNeuronAI — docker-compose.yml
#
# Services:
#   api        — REST API server (FastAPI + uvicorn)
#   frontend   — Operations Dashboard (nginx serve devops-d)
#   status     — 快速健康檢查 (CLI)
#   backtest   — 回測歷史數據 (CLI)
#   simulate   — 模擬紙交易 (CLI)
#   trade      — 測試網 / paper-live / 正式網交易 (需 profile 啟用)
#
# 用法範例:
#   docker compose up api             # 啟動 API server
#   docker compose up api frontend    # 啟動後端 + 前端
#   docker compose run --rm status    # CLI 健康檢查
#   docker compose --profile trade up trade
# ============================================================

x-common: &common
  image: bioneuronai-api:latest
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  env_file:
    - .env
  volumes:
    - bioneuron-data:/app/data
    - bioneuron-logs:/app/logs
    - ./backtest:/app/backtest
  restart: "no"

services:
  # ---- REST API Server ----
  api:
    <<: *common
    container_name: bioneuron-api
    command: ["-m", "uvicorn", "bioneuronai.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/status')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- 健康檢查 / 系統狀態 ----
  status:
    <<: *common
    container_name: bioneuron-status
    command: ["main.py", "status"]

  # ---- 新聞情緒分析 ----
  news:
    <<: *common
    container_name: bioneuron-news
    command: ["main.py", "news", "--symbol", "${TRADE_SYMBOL:-BTCUSDT}", "--max-items", "10"]

  # ---- 交易前置檢查 ----
  pretrade:
    <<: *common
    container_name: bioneuron-pretrade
    command: ["main.py", "pretrade", "--symbol", "${TRADE_SYMBOL:-BTCUSDT}", "--action", "${TRADE_ACTION:-long}"]

  # ---- 每日交易計畫 ----
  plan:
    <<: *common
    container_name: bioneuron-plan
    command: ["main.py", "plan", "--output", "/app/data/daily_plan.json"]

  # ---- 回測 ----
  backtest:
    <<: *common
    container_name: bioneuron-backtest
    command: [
      "main.py", "backtest",
      "--symbol",   "${BACKTEST_SYMBOL:-BTCUSDT}",
      "--interval", "${BACKTEST_INTERVAL:-1h}",
      "--start-date", "${BACKTEST_START:-2020-01-01}",
      "--end-date",   "${BACKTEST_END:-2020-01-03}",
      "--balance", "${BACKTEST_BALANCE:-10000}",
      "--warmup-bars", "${BACKTEST_WARMUP_BARS:-10}"
    ]

  # ---- 模擬紙交易 ----
  simulate:
    <<: *common
    container_name: bioneuron-simulate
    command: [
      "main.py", "simulate",
      "--symbol",  "${TRADE_SYMBOL:-BTCUSDT}",
      "--interval", "${BACKTEST_INTERVAL:-1h}",
      "--balance", "${SIM_BALANCE:-100000}",
      "--bars",    "${SIM_BARS:-200}",
      "--start-date", "${SIM_START:-2020-01-01}",
      "--end-date",   "${SIM_END:-2020-01-03}"
    ]

  # ---- 交易監控 (需要明確啟用 profile) ----
  trade:
    <<: *common
    container_name: bioneuron-trade
    profiles:
      - trade
    command: ["main.py", "trade", "--testnet"]   # 預設測試網；paper-live 可覆寫為 main.py trade --paper-live
    restart: unless-stopped           # 自動重啟，適合長時間運行
    stop_grace_period: 30s

  # ---- Operations 前端面板 (nginx serve devops-d) ----
  frontend:
    build:
      context: ./frontend/devops-d
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: bioneuron-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bioneuron-data:
    driver: local
    driver_opts:
      type: none
      device: ${DATA_DIR:-./data}
      o: bind
  bioneuron-logs:
    driver: local
    driver_opts:
      type: none
      device: ${LOGS_DIR:-./logs}
      o: bind
